<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --fg:#f2f3f7; --muted:#a3a9b6; --glass:rgba(20,21,27,.84); --line:rgba(255,255,255,.09);
          --spring:cubic-bezier(.34,1.46,.64,1); --soft:cubic-bezier(.22,1,.36,1); }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; color:var(--fg); user-select:none; -webkit-user-select:none; }
  #stage { position:absolute; inset:0; }
  #orbwrap { position:absolute; left:50%; bottom:0; width:180px; height:150px; margin-left:-90px; }
  #orb { position:absolute; inset:0; cursor:pointer; }
  #cap { position:absolute; left:0; right:0; bottom:14px; text-align:center; font-size:11.5px; letter-spacing:.3px; color:var(--muted); overflow:hidden; text-overflow:ellipsis;
         text-shadow:0 1px 6px rgba(0,0,0,.65); opacity:0; transform:translateY(5px); transition:opacity .35s var(--soft), transform .5s var(--spring); pointer-events:none; white-space:nowrap; }
  #cap.show { opacity:1; transform:none; }
  #orbWave { position:absolute; left:42px; bottom:6px; width:96px; height:18px; pointer-events:none;
             opacity:0; transform:translateY(3px) scaleX(.85); transition:opacity .18s ease, transform .38s var(--soft); }
  body.audio-active #orbWave { opacity:1; transform:none; }
  body.audio-active #cap { opacity:0; }

  /* hover controls */
  .ctl { position:absolute; top:70px; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
         background:rgba(24,25,31,.82); border:1px solid rgba(255,255,255,.12); box-shadow:0 4px 14px rgba(0,0,0,.4); backdrop-filter:blur(10px);
         opacity:0; transform:scale(.4); pointer-events:none; cursor:pointer; transition:opacity .2s var(--soft), transform .45s var(--spring), background .15s; }
  #muteMic { left:16px; } #muteMaeve { right:16px; }
  body.hover .ctl { opacity:1; transform:none; pointer-events:auto; }
  body.hover #muteMaeve { transition-delay:.04s; }
  .ctl:hover { background:rgba(44,46,56,.92); }
  .ctl:active { transform:scale(.88); }
  .ctl svg { width:15px; height:15px; stroke:#e9ebf1; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .ctl .slash { opacity:0; transition:opacity .15s; }
  .ctl.muted { background:rgba(120,30,38,.85); border-color:rgba(255,120,120,.4); }
  .ctl.muted .slash { opacity:1; }
  /* small persistent badge when something is muted and the controls are hidden */
  #badge { position:absolute; left:50%; top:94px; margin-left:20px; font-size:9.5px; color:#ffb4b4; opacity:0; transition:opacity .3s; pointer-events:none; text-shadow:0 1px 4px rgba(0,0,0,.7); }
  #badge.show { opacity:1; }
  body.hover #badge { opacity:0; }

  /* speech bubble (T3 minimized) */
  #bubble { position:absolute; left:50%; bottom:112px; width:300px; margin-left:-150px; box-sizing:border-box;
            background:var(--glass); backdrop-filter:blur(20px) saturate(1.35); border:1px solid var(--line); border-radius:18px;
            padding:9px 13px 10px; box-shadow:0 14px 40px rgba(0,0,0,.45);
            opacity:0; transform:translateY(6px); transform-origin:50% 100%; transition:opacity .18s ease-out, transform .18s var(--soft); pointer-events:none; }
  #bubble.show { opacity:1; transform:none; pointer-events:auto; transition:opacity .22s var(--soft), transform .38s var(--spring); }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-6px; width:12px; height:12px; margin-left:-6px; background:rgba(20,21,27,.92);
                   border-right:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg); border-radius:0 0 3px 0; }
  #who { font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:#c4a8ff; margin-bottom:3px; }
  #bubble.you #who { color:#ffcf8a; }
  #bubbleText { position:relative; font-size:13px; line-height:1.45; min-height:1.45em; max-height:113px;
                overflow:hidden; overflow-anchor:none; white-space:pre-wrap; overflow-wrap:anywhere; }
  #bmeasure { visibility:hidden; pointer-events:none; }
  #btext { position:absolute; inset:0; overflow:hidden; overflow-anchor:none; }
  #bubble.you #btext { color:#d9dce3; }
  #bubbleText .word { display:inline-block; max-width:100%; }
  #btext .fresh { animation:ink .42s var(--soft) both; animation-delay:var(--ink-delay,0ms); }
  @keyframes ink { from { opacity:0; filter:blur(4px); transform:translateY(5px); } to { opacity:1; filter:blur(0); transform:none; } }
  @media (prefers-reduced-motion:reduce) { #btext .fresh { animation:none; } }

  /* minimize chip (orb mode, on hover) */
  #toBar { position:absolute; left:118px; top:36px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
           background:rgba(24,25,31,.82); border:1px solid rgba(255,255,255,.12); cursor:pointer; opacity:0; transform:scale(.4); pointer-events:none;
           transition:opacity .2s var(--soft), transform .45s var(--spring), background .15s; transition-delay:.08s; }
  body.hover #toBar { opacity:1; transform:none; pointer-events:auto; }
  #toBar:hover { background:rgba(44,46,56,.92); }
  #toBar svg { width:12px; height:12px; stroke:#e9ebf1; fill:none; stroke-width:2; stroke-linecap:round; }

  /* toolbar (minimized) */
  #bar { position:absolute; left:50%; bottom:4px; width:196px; height:40px; margin-left:-98px; box-sizing:border-box; border-radius:20px;
         display:none; align-items:center; gap:4px; padding:0 6px 0 0; background:rgba(18,19,24,.86); border:1px solid rgba(255,255,255,.10);
         backdrop-filter:blur(18px) saturate(1.3); box-shadow:0 8px 26px rgba(0,0,0,.42); }
  body.bar #bar { display:flex; animation:barIn .5s var(--spring); }
  body.bar #orbwrap { display:none; }
  @keyframes barIn { from { transform:scale(.6); opacity:0; } to { transform:none; opacity:1; } }
  #barOrb { width:40px; height:40px; flex:none; position:relative; cursor:pointer; }
  body.bar #orb { inset:auto; left:-8px; top:-8px; }
  #wave { width:52px; height:24px; flex:none; }
  .bbtn { width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
          background:rgba(255,255,255,.06); transition:background .15s, transform .35s var(--spring); }
  .bbtn:hover { background:rgba(255,255,255,.14); }
  .bbtn:active { transform:scale(.86); }
  .bbtn svg { width:14px; height:14px; stroke:#e9ebf1; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .bbtn .slash { opacity:0; transition:opacity .15s; }
  .bbtn.muted { background:rgba(120,30,38,.85); }
  .bbtn.muted .slash { opacity:1; }
  body.bar #bubble { bottom:56px; }
  body.bar #card { bottom:54px; max-height:calc(100% - 64px); }
  body.bar #cap, body.bar #badge { display:none; }

  /* settings card */
  #card { position:absolute; left:12px; right:12px; bottom:150px; max-height:calc(100% - 160px); background:var(--glass); backdrop-filter:blur(18px) saturate(1.3); border:1px solid var(--line); border-radius:20px; padding:10px 12px 10px; box-sizing:border-box; opacity:0; transform:translateY(14px) scale(.94); transform-origin:50% 100%; transition:opacity .25s ease, transform .45s var(--spring); pointer-events:none; box-shadow:0 12px 40px rgba(0,0,0,.45); }
  #card.open { opacity:1; transform:none; pointer-events:auto; }
  #delivery { width:100%; box-sizing:border-box; margin-top:7px; padding:5px 8px; border-radius:9px; border:1px solid var(--line); background:#292b34; color:var(--fg); font:11.5px "Segoe UI",sans-serif; }
  #review { display:none; position:absolute; left:50%; bottom:112px; width:300px; margin-left:-150px; box-sizing:border-box; padding:11px 13px; border-radius:18px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(20px); box-shadow:0 12px 35px rgba(0,0,0,.35); }
  #review.show { display:block; animation:barIn .35s var(--spring); }
  body.bar #review { bottom:56px; }
  #reviewTitle { font-size:10px; color:#c4a8ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:5px; }
  #reviewText { width:100%; height:70px; resize:none; border:0; outline:none; background:transparent; color:var(--fg); font:13px/1.4 "Segoe UI",sans-serif; box-sizing:border-box; user-select:text; -webkit-user-select:text; }
  #review .foot { margin-top:5px; }
  #review button { border:0; border-radius:9px; padding:5px 9px; background:rgba(139,114,255,.25); color:var(--fg); cursor:pointer; }
  #review button:disabled { opacity:.5; cursor:wait; }
  [aria-disabled="true"] { pointer-events:none; opacity:.5; }
  [role="button"]:focus-visible, button:focus-visible, select:focus-visible { outline:2px solid #b9a0ff; outline-offset:3px; }
  body.reviewing #bubble { display:none; }
  .thread { display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer; padding:6px 8px; border-radius:10px; }
  .thread:hover { background:rgba(255,255,255,.06); }
  .thread .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .thread .chev { color:var(--muted); font-size:10px; }
  #list { display:none; max-height:110px; overflow:auto; margin:4px 0 6px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  #list.open { display:block; }
  #list div { padding:6px 8px; font-size:12px; border-radius:8px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #list div:hover { background:rgba(255,255,255,.08); }
  .row { display:flex; gap:6px; margin-top:8px; }
  .pill { flex:1; text-align:center; font-size:11.5px; padding:7px 6px; border-radius:999px; background:rgba(255,255,255,.07); border:1px solid transparent; cursor:pointer; transition:background .15s, border-color .15s, transform .35s var(--spring); white-space:nowrap; }
  .pill:hover { background:rgba(255,255,255,.12); }
  .pill:active { transform:scale(.94); }
  .pill.on { background:rgba(111,141,255,.22); border-color:rgba(111,141,255,.5); }
  .pill.danger:hover { background:rgba(255,94,94,.22); }
  .modehint { flex:1; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); }
  .foot { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:10.5px; color:var(--muted); }
  .foot span { cursor:pointer; padding:2px 4px; border-radius:6px; }
  .foot span:hover { color:var(--fg); background:rgba(255,255,255,.06); }
  #menu { position:absolute; right:14px; bottom:40px; background:rgba(30,31,38,.97); border:1px solid var(--line); border-radius:12px; padding:6px; display:none; min-width:220px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  #menu.open { display:block; }
  #menu div { padding:5px 10px; font-size:12px; border-radius:8px; cursor:pointer; }
  #menu div:hover { background:rgba(255,255,255,.08); }
  #menu div.on::before { content:"✓ "; color:#8fb0ff; }
  #menu div:not(.on)::before { content:"\2003"; }
  #detail { font-size:10.5px; color:var(--muted); margin-top:8px; min-height:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"><div id="who">Maeve</div><div id="bubbleText"><div id="bmeasure" aria-hidden="true"></div><div id="btext"></div></div></div>
  <div id="card">
    <div class="thread" id="threadBtn"><span class="t" id="threadName">Choose a thread</span><span class="chev">▼</span></div>
    <div id="list"></div>
    <div class="row">
      <div class="pill" id="pVoice">Voice off</div>
      <span class="modehint" id="pMode">Hold to talk</span>
      <div class="pill danger" id="pStop">Stop</div>
    </div>
    <div id="detail"></div>
    <select id="delivery" title="Choose how your transcript is delivered" aria-label="Transcript delivery">
      <option value="immediate">Send immediately</option>
      <option value="review">Review above the orb · Enter to send</option>
      <option value="composer">Draft in T3 · Enter there to send</option>
    </select>
    <div class="foot"><span id="fTest">Test Maeve</span><span id="fMore">Options ⋯</span><span id="fQuit">Quit</span></div>
    <div id="menu">
      <div id="mFollow">Follow active T3 thread</div>
      <div id="mCleanup">Clean up with OpenWhispr's model</div>
      <div id="mStartup">Start with Windows</div>
      <div id="mFx">FRIDAY voice effect</div>
      <div id="mDock">Minimize to toolbar</div>
    </div>
  </div>
  <div id="review">
    <div id="reviewTitle" aria-live="polite"></div>
    <textarea id="reviewText" aria-label="Review transcript" placeholder="Review your words…"></textarea>
    <div class="foot"><span id="reviewCancel">Cancel · Esc</span><span>Shift+Enter: new line</span><button id="reviewSend">Send ↵</button></div>
  </div>
  <div id="orbwrap">
    <canvas id="orb" aria-label="Open settings"></canvas>
    <div class="ctl" id="muteMic" title="Mute my microphone">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/><path class="slash" d="M4 4l16 16"/></svg>
    </div>
    <div class="ctl" id="muteMaeve" title="Mute Maeve">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="slash" d="M4 4l16 16"/></svg>
    </div>
    <div id="toBar" title="Minimize to toolbar"><svg viewBox="0 0 24 24"><path d="M5 17h14"/></svg></div>
    <div id="badge"></div>
    <canvas id="orbWave" aria-hidden="true"></canvas>
    <div id="cap" role="status" aria-live="polite"></div>
  </div>
  <div id="bar">
    <div id="barOrb" title="Settings"></div>
    <canvas id="wave"></canvas>
    <div class="bbtn" id="barMic" title="Mute my microphone">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/><path class="slash" d="M4 4l16 16"/></svg>
    </div>
    <div class="bbtn" id="barMaeve" title="Mute Maeve">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="slash" d="M4 4l16 16"/></svg>
    </div>
    <div class="bbtn" id="barExpand" title="Expand to orb">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/></svg>
    </div>
  </div>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;      // canvas size in device px
uniform vec2 uCenter;   // orb centre in device px
uniform float uR;       // orb radius in device px (spring-animated)
uniform float uTime;
uniform float uLevel;   // 0..1 spring-animated audio level
uniform float uGlow;    // 0..1 halo strength
uniform float uBusy;    // 0..1 busy ring visibility
uniform float uSpin;    // busy ring angle
uniform float uArc;     // busy ring arc length
uniform float uOff;     // 0..1 voice-off desaturation
uniform vec3 uA, uB, uC; // palette: deep, mid, bright
uniform float uAppear;  // 0..1 pop-in
uniform vec4 uBands;    // smoothed voice energy: low, low-mid, high-mid, high
uniform float uFlow;    // time that runs faster while someone speaks (never jumps)
uniform float uParticles; // 0..1 particle presence

vec3 hash3(vec3 p){ p = vec3(dot(p,vec3(127.1,311.7,74.7)), dot(p,vec3(269.5,183.3,246.1)), dot(p,vec3(113.5,271.9,124.6))); return -1.0 + 2.0*fract(sin(p)*43758.5453123); }
float noise(vec3 p){ vec3 i = floor(p); vec3 f = fract(p); vec3 u = f*f*(3.0-2.0*f);
  return mix(mix(mix(dot(hash3(i+vec3(0,0,0)),f-vec3(0,0,0)), dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                 mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)), dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
             mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)), dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                 mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)), dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z); }
float fbm(vec3 p){ float v = 0.0, a = 0.5; for (int i=0;i<4;i++){ v += a*noise(p); p = p*2.03 + 7.1; a *= 0.5; } return v; }

void main(){
  vec2 px = gl_FragCoord.xy;
  vec2 d = (px - uCenter) / uR;
  float t = uTime;
  float ang = atan(d.y, d.x);
  // fluid silhouette: low-frequency wobble that grows with level
  float fl = uFlow;
  // fluid silhouette: slow noise plus voice-driven lobes, each band at its own angular frequency
  float lobes = uBands.x*0.075*sin(2.0*ang + fl*0.9)
              + uBands.y*0.055*sin(3.0*ang - fl*1.3 + 1.7)
              + uBands.z*0.038*sin(5.0*ang + fl*1.9 + 0.6)
              + uBands.w*0.024*sin(8.0*ang - fl*2.6 + 2.2);
  float wob = 1.0 + (0.022 + 0.05*uLevel) * fbm(vec3(cos(ang)*1.2, sin(ang)*1.2, fl*0.32)) + lobes;
  float r = length(d) / wob;
  vec4 col = vec4(0.0);

  // particles: soft motes that orbit, drift outward and respawn; more and brighter with voice
  if (uParticles > 0.01) {
    for (int i = 0; i < 26; i++) {
      float fi = float(i);
      float h1 = fract(sin(fi*12.9898)*43758.5453);
      float h2 = fract(sin(fi*78.233)*12345.678);
      float h3 = fract(sin(fi*39.425)*24634.635);
      float dir = h1 > 0.5 ? 1.0 : -1.0;
      float life = fract(fl*0.07*(0.55 + h3) + h2);
      float a = h1*6.2831853 + fl*dir*(0.22 + 0.4*h2) + life*dir*1.4;   // spiral as they drift out
      float rad = 1.1 + life*(0.42 + 0.55*uLevel) + 0.04*sin(fl*1.7 + fi);
      vec2 pp = vec2(cos(a), sin(a)) * rad;
      pp += 0.05*vec2(sin(fl*1.3 + fi*2.1), cos(fl*1.1 + fi*1.7));
      vec2 dv = d - pp;
      float size = (0.022 + 0.022*h3) * (1.0 + 0.8*uLevel);
      float glow = exp(-dot(dv, dv) / (size*size));
      float pa = glow * sin(life*3.14159) * uParticles * (0.55 + 0.45*h2);
      vec3 pc = mix(uB, uC, 0.35 + 0.65*h3);
      col += vec4(pc * pa, pa * 0.6);
    }
  }

  // halo
  float halo = exp(-max(0.0, r - 1.0) * (4.6 - 0.8*uLevel)) * smoothstep(0.98, 1.04, r);
  vec3 haloCol = mix(uB, uC, 0.4);
  float haloAlpha = 0.35 * halo * (0.42*uGlow + 0.25*uLevel);
  col += vec4(haloCol * haloAlpha, haloAlpha);

  // busy ring
  if (uBusy > 0.001) {
    float ring = 1.0 - smoothstep(0.0, 0.03, abs(r - 1.24));
    float a = mod(ang - uSpin, 6.2831853);
    float seg = smoothstep(0.0, 0.25, a) * (1.0 - smoothstep(uArc-0.35, uArc, a));
    float ringAlpha = 0.6 * ring * (0.12 + 0.88*seg) * uBusy;
    col += vec4(uC * ringAlpha, ringAlpha);
  }

  // sphere
  if (r < 1.0) {
    float z = sqrt(max(0.0, 1.0 - r*r));
    vec3 n = normalize(vec3(d.x/wob, d.y/wob, z));
    vec3 sp = vec3(n.xy*1.2, z*0.6);
    vec3 warp = vec3(fbm(sp*0.9 + vec3(0.0, fl*0.16, fl*0.10)), fbm(sp*0.9 + vec3(5.2, -fl*0.12, fl*0.08)), 0.0);
    float f1 = fbm(sp*1.3 + warp*1.6 + vec3(fl*0.10, -fl*0.07, fl*0.12 + 0.25*uLevel));
    float f2 = fbm(sp*2.0 - warp*1.2 + vec3(-fl*0.16, fl*0.09, 3.0));
    float band = smoothstep(-0.35, 0.40, f1 + 0.30*f2);
    vec3 body = mix(uA, uB, band);
    body = mix(body, uC, smoothstep(0.20, 0.70, f2 + 0.35*uLevel) * 0.6);
    // glassy depth: darker toward the limb, brighter core
    body *= 0.75 + 0.45*z;
    vec3 L = normalize(vec3(-0.55, 0.75, 0.6));
    float diff = 0.45 + 0.55*max(0.0, dot(n, L));
    float fres = pow(1.0 - max(0.0, n.z), 2.6);
    vec3 V = vec3(0.0,0.0,1.0); vec3 H = normalize(L+V);
    float spec = pow(max(0.0, dot(n,H)), 120.0) * 0.85 + pow(max(0.0, dot(n,H)), 10.0)*0.22;
    vec3 c = body*diff + uC*fres*0.7 + vec3(1.0)*spec;
    c += uC * (0.10 + 0.25*uLevel) * (1.0 - r*r);
    c += uB * 0.12 * max(0.0, -n.y) * (1.0 - fres);
    float desat = dot(c, vec3(0.299,0.587,0.114));
    c = mix(c, vec3(desat)*0.9, uOff*0.75);
    float edge = 1.0 - smoothstep(0.985, 1.0, r);
    col = mix(col, vec4(c, 1.0), edge);
  }
  float a = clamp(uAppear, 0.0, 1.0);
  float alpha = clamp(col.a, 0.0, 1.0);
  float canvasEdge = min(min(px.x, uRes.x-px.x), min(px.y, uRes.y-px.y));
  float fade = smoothstep(0.0, max(1.0, uR*0.2), canvasEdge);
  // WebView2 requires premultiplied RGB <= alpha, including the translucent halo.

// Damped harmonic springs: every motion overshoots a little and settles, Apple style.

const BARS = 11, bandS = new Array(BARS).fill(0), ampS = new Spring(0, 90, 15);

  const spectrum=['hearing','dictating'].includes(state)?S.micBands:playbackActive()?S.outBands:null;

      'I found the cause. The Windows runner pins Node 20, but the lockfile was regenerated with Node 24, so npm ci rejects it. I will pin the runner to Node 24 and rerun the pipeline.'};
  if (Q.get('hover')) { hovering = true; document.body.classList.add('hover'); }
  if(!Q.has('static')) setInterval(()=>{ const t = Date.now(); S.mic = .12 + .22*Math.abs(Math.sin(t/95)) * (0.5+0.5*Math.sin(t/700)); S.out = .10 + .22*Math.abs(Math.sin(t/70)) * (0.5+0.5*Math.sin(t/500)); render(); }, 50);
  if (!seq.includes(DEMO)) setInterval(()=>{ i=(i+1)%seq.length; S.state=seq[i]; S.voiceOn = S.state!=='off'; }, 1800);
  if (Q.get('card')) { expanded = true; card.classList.add('open'); }
  if (Q.get('review')) { S.state='reviewing'; S.review={id:1,text:'Please check why the Windows build failed and fix the cause.',title:S.threadTitle}; }
} else {
  window.addEventListener('pywebviewready', poll);
}
let wantExpanded = false;   // the latest requested state; the card opens only after the window grows
function applyExpanded(v){ expanded=v; wantExpanded=v; card.classList.toggle('open', v); if(!v){document.getElementById('list').classList.remove('open'); document.getElementById('menu').classList.remove('open');} }
function setExpanded(v){
  if (S.review || wantExpanded===v) return;
  wantExpanded = v;
  ++settingsGeneration; ++settingsPending;
  const generation = settingsGeneration;
  S.expanded = v;
  if (!v) applyExpanded(false);
  // WebView bridge calls run on separate Python threads. Preserve click order. Open only after the
  // window has grown, so the card never lays out over the orb in the small window first.
  settingsWrites = settingsWrites.then(()=>api('set_expanded', v))
    .then(()=> v ? new Promise(r=>setTimeout(r, 90)) : null)
    .then(()=>{ if (v && wantExpanded && generation === settingsGeneration) applyExpanded(true); })
    .catch(()=>{}).finally(()=>{--settingsPending;});
}
function panelExtra(){ api('set_panel_extra', document.getElementById('list').classList.contains('open')); }
function setHover(v){ if (hovering===v) return; hovering = v; document.body.classList.toggle('hover', v); api('set_hover', v); render(); }
document.getElementById('orbwrap').addEventListener('mouseenter', ()=> setHover(true));
let choosingDelivery=false;
document.getElementById('delivery').addEventListener('pointerdown', ()=>{choosingDelivery=true;});
document.getElementById('delivery').addEventListener('blur', ()=>{choosingDelivery=false;});
// The engine closes the card on a click elsewhere or a sustained pointer exit; focus changes
// inside WebView2 fire spurious mouseleave events, so the page never closes it on its own here.
function dismissAfterLeave(){ setHover(false); }
document.body.addEventListener('mouseleave', dismissAfterLeave);
let dragStart=null;
cv.addEventListener('pointerdown',e=>{dragStart=[e.screenX,e.screenY];});
cv.addEventListener('pointercancel',()=>{dragStart=null;});
cv.addEventListener('click', e=> {const moved=dragStart&&Math.hypot(e.screenX-dragStart[0],e.screenY-dragStart[1])>5;dragStart=null;if(!moved)setExpanded(!expanded);});
function toggleDock(){ S.dock = !S.dock; setExpanded(false); setHover(false); layout(!!S.dock); api('toggle_dock'); }
document.getElementById('toBar').addEventListener('click', (e)=>{ e.stopPropagation(); toggleDock(); });
document.getElementById('barExpand').addEventListener('click', (e)=>{ e.stopPropagation(); toggleDock(); });
document.getElementById('bar').addEventListener('mouseenter', ()=> setHover(true));
function toggleMicMute(){S.micMuted=!S.micMuted;render();api('toggle_mic_mute');}
function toggleMaeveMute(){S.maeveMuted=!S.maeveMuted;render();api('toggle_maeve_mute');}
barMic.addEventListener('click', (e)=>{ e.stopPropagation(); toggleMicMute(); });
barMaeve.addEventListener('click', (e)=>{ e.stopPropagation(); toggleMaeveMute(); });
document.getElementById('mDock').onclick = ()=> { document.getElementById('menu').classList.remove('open'); toggleDock(); };
document.getElementById('mFollow').onclick = ()=> { document.getElementById('menu').classList.remove('open'); panelExtra(); api('toggle_follow_active'); };
muteMic.addEventListener('click', (e)=>{ e.stopPropagation(); toggleMicMute(); });
muteMaeve.addEventListener('click', (e)=>{ e.stopPropagation(); toggleMaeveMute(); });
document.getElementById('threadBtn').onclick = ()=> { document.getElementById('list').classList.toggle('open'); panelExtra(); };
document.getElementById('pVoice').onclick = ()=> api('toggle_voice');
document.getElementById('pStop').onclick = ()=> api('stop');
document.getElementById('fTest').onclick = ()=> api('test_voice');
document.getElementById('fQuit').onclick = ()=> api('quit');
document.getElementById('fMore').onclick = (e)=>{ e.stopPropagation(); document.getElementById('menu').classList.toggle('open'); panelExtra(); };
function closeMenu(){document.getElementById('menu').classList.remove('open');panelExtra();}
document.getElementById('mCleanup').onclick = ()=> {closeMenu();api('toggle_cleanup');};
document.getElementById('mStartup').onclick = ()=> {closeMenu();api('toggle_startup');};
document.getElementById('mFx').onclick = ()=> {closeMenu();S.voiceFx = S.voiceFx === false;render();api('toggle_voice_fx');};
document.getElementById('delivery').onchange = e=> { choosingDelivery=false; S.delivery=e.target.value; api('set_delivery', S.delivery); };
reviewText.addEventListener('input', ()=>{ document.getElementById('reviewSend').disabled=!reviewText.value.trim() || !!S.review?.sending; });
function sendReview(){ if (!S.review || !reviewText.value.trim() || document.getElementById('reviewSend').disabled) return; document.getElementById('reviewSend').disabled=true; api('confirm_review', S.review.id, reviewText.value); }
document.getElementById('reviewSend').onclick = sendReview;
document.getElementById('reviewCancel').onclick = ()=> api('cancel_review');
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu,#fMore')&&document.getElementById('menu').classList.contains('open'))closeMenu();});
for(const el of document.querySelectorAll('.ctl,.bbtn,.pill,#orb,#toBar,#barOrb,#threadBtn,.foot span,#menu div')){
  el.setAttribute('role','button');el.tabIndex=0;
  if(el.title)el.setAttribute('aria-label',el.title);
  el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();e.stopPropagation();el.click();}});
}
// Keep text selection and controls out of pywebview's window-drag handler.
document.addEventListener('mousedown',e=>{if(e.target.id!=='orb'&&e.target.closest('textarea,input,select,button,[role="button"],#card,#review'))e.stopPropagation();});
document.addEventListener('keydown', e=>{
  if (S.review && !e.isComposing && (e.key==='Escape' || (e.key==='Enter' && !e.shiftKey))) {
    e.preventDefault(); e.stopPropagation();
    if(e.key==='Enter') sendReview(); else api('cancel_review');
    return;
  }
  if (e.key==='Escape') { if (expanded) setExpanded(false); else api('stop'); }
});
</script>
</body>
</html>
